<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLU Connect - Dashboard</title>
    <style>
      :root {
        --bg-top: #f2f6ff;
        --bg-bottom: #fff8ef;
        --surface: #ffffff;
        --surface-border: #e9eef9;
        --ink: #1d2433;
        --muted: #5f6b7f;
        --accent: #1568ff;
        --accent-soft: #e7f0ff;
        --danger: #c0362c;
        --radius: 16px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, #e5eeff 0%, transparent 34%),
          radial-gradient(circle at 92% 0%, #ffe7cf 0%, transparent 26%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        min-height: 100vh;
      }

      .page {
        width: min(860px, 100% - 32px);
        margin: 28px auto 40px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: 0 8px 28px rgba(24, 36, 62, 0.08);
      }

      .brand {
        font-size: 20px;
        font-weight: 700;
      }

      .logout {
        text-decoration: none;
        color: var(--accent);
        font-weight: 600;
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #cbdcfb;
        background: #f5f9ff;
      }

      .hero {
        margin-top: 18px;
        background: linear-gradient(145deg, #f7fbff, #ffffff 45%, #fff5ea);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        padding: 22px;
        box-shadow: 0 10px 30px rgba(24, 36, 62, 0.08);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 20px;
        flex-shrink: 0;
      }

      .hero-title {
        font-size: 22px;
        font-weight: 700;
      }

      .hero-subtitle {
        color: var(--muted);
        margin-top: 4px;
        font-size: 14px;
      }

      .profile {
        margin-top: 18px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        padding: 14px 18px;
        box-shadow: 0 8px 28px rgba(24, 36, 62, 0.08);
      }

      .profile h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 8px;
        padding: 11px 0;
        border-bottom: 1px solid #eef2fa;
      }

      .row:last-child {
        border-bottom: none;
      }

      .label {
        color: var(--muted);
        font-size: 14px;
      }

      .value {
        font-size: 14px;
        font-weight: 600;
        word-break: break-word;
      }

      .state {
        margin-top: 18px;
        background: var(--surface);
        border: 1px dashed #d8e3fb;
        border-radius: var(--radius);
        padding: 16px;
        text-align: center;
        color: var(--muted);
      }

      .state.error {
        color: var(--danger);
        border-color: #f2b9b3;
        background: #fff5f4;
      }

      @media (max-width: 640px) {
        .page {
          width: calc(100% - 20px);
          margin-top: 12px;
        }

        .topbar {
          padding: 12px;
        }

        .brand {
          font-size: 18px;
        }

        .hero {
          padding: 16px;
        }

        .hero-title {
          font-size: 18px;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">🎓 VLU Connect</div>
        <a class="logout" href="/auth/logout">Đăng xuất</a>
      </header>

      <section class="hero">
        <div class="avatar" id="avatar">--</div>
        <div>
          <div class="hero-title" id="displayName">Đang tải...</div>
          <div class="hero-subtitle" id="mail">--</div>
        </div>
      </section>

      <section class="profile">
        <h2>Thông tin tài khoản</h2>
        <div id="profileRows" class="state">Đang tải dữ liệu từ /api/me...</div>
      </section>
    </main>

    <script>
      function initialsFromName(name) {
        if (!name) return "??";
        return name
          .split(" ")
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0])
          .join("")
          .toUpperCase();
      }

      function safeValue(value) {
        if (value === null || value === undefined || value === "") return "--";
        if (Array.isArray(value)) return value.length ? value.join(", ") : "--";
        return String(value);
      }

      function renderRows(profile) {
        const rows = [
          ["Mã người dùng", profile.id],
          ["Display Name", profile.displayName],
          ["Given Name", profile.givenName],
          ["Surname", profile.surname],
          ["Email", profile.mail],
          ["UPN", profile.userPrincipalName],
          ["Chức danh", profile.jobTitle],
          ["SĐT công việc", profile.businessPhones],
          ["Di động", profile.mobilePhone],
          ["Văn phòng", profile.officeLocation],
          ["Ngôn ngữ", profile.preferredLanguage],
        ];

        return rows
          .map(
            ([label, value]) =>
              `<div class="row"><div class="label">${label}</div><div class="value">${safeValue(value)}</div></div>`,
          )
          .join("");
      }

      function renderError(message) {
        document.getElementById("displayName").textContent = "Chưa đăng nhập";
        document.getElementById("mail").textContent =
          "Vui lòng đăng nhập Microsoft";
        document.getElementById("avatar").textContent = "?";
        document.getElementById("profileRows").innerHTML =
          `<div class="state error">${message} <a href="/" style="color:#1568ff;font-weight:700;text-decoration:none;">Quay lại đăng nhập</a></div>`;
      }

      async function loadProfile() {
        try {
          const response = await fetch("/api/me", {
            credentials: "same-origin",
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            renderError(payload.error || "Không thể lấy dữ liệu từ /api/me.");
            return;
          }

          const payload = await response.json();
          const profile = payload.profile || {};
          document.getElementById("displayName").textContent =
            profile.displayName || "Không có tên";
          document.getElementById("mail").textContent =
            profile.mail || profile.userPrincipalName || "--";
          document.getElementById("avatar").textContent = initialsFromName(
            profile.displayName,
          );
          document.getElementById("profileRows").innerHTML =
            renderRows(profile);
        } catch (error) {
          renderError("Lỗi kết nối server. Vui lòng thử lại.");
        }
      }

      document.addEventListener("DOMContentLoaded", loadProfile);
    </script>
  </body>
</html>
